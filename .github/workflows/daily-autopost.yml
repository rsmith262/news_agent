name: Daily Threads Autopost

on:
  schedule:
    - cron: "55 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autopost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Randomize execution within 8-9am UK window
        run: |
          python - <<'PY'
          import random
          import time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/London")
          now = datetime.now(tz)
          start = now.replace(hour=8, minute=0, second=0, microsecond=0)
          end = now.replace(hour=9, minute=0, second=0, microsecond=0)

          if now >= end:
              print("Already past the 8-9am UK window, continuing immediately.")
          else:
              if now > start:
                  start = now
              target = start + timedelta(
                  seconds=random.randint(0, max(0, int((end - start).total_seconds())))
              )
              delay = max(0, int((target - now).total_seconds()))
              print(f"Current UK time: {now.isoformat()}")
              print(f"Target UK time:  {target.isoformat()}")
              print(f"Sleeping for {delay} seconds")
              time.sleep(delay)
          PY

      - name: Run daily autopost
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: "true"
        run: python -m newsagent.autopost
